# P2: 4-channel early fusion with a stride-4 detection level, served at low resolution.
#
# Why: AP_large is flat across 320-640 px (67.7 / 71.0 / 69.7) while AP_small collapses
# (5.7 / 11.2 / 17.6), so low-resolution loss is a detection-grid limit, not a feature
# limit. A P2 level reaches a finer grid at 400 px (10.2 native px/cell) than the stock
# model does at 640 px (12.8), at an estimated 21.7 ms vs 27.8 ms on 4 pinned CPU threads.
#
# Warm-started from the trained P3-P5 model: layers 0-16 transfer directly, 17-22 remap
# onto 23-28, and only the new P2 blocks (19, 20, 22) and the Detect head's stride-4
# level start fresh (~68% of tensors transfer). See fusion/p2warm.py.
name: p2_fusion
model: configs/models/yolo26n-p2-4ch.yaml
weights: /home/whisenaj/anaconda3/envs/Systems_Class/model/runs/ms_fusion_seed42/weights/last.pt
data: /mnt/12TB_Drive/whisenaj/Datasets/M3FD_4ch/fusion.yaml
seed: 42
ms_sizes: [320, 400, 480]   # the range this model is meant to serve; P2 @640 is off the frontier
train:
  imgsz: 640
  epochs: 30
  batch: 16
  optimizer: SGD
  lr0: 0.005          # 0.5x baseline: converged backbone, new neck blocks and head level
  warmup_epochs: 1.0
  close_mosaic: 30    # mosaic off for the whole fine-tune
  freeze: 11          # backbone frozen; the neck must adapt to the new P2 branch
  workers: 8
  cache: ram
  plots: true
