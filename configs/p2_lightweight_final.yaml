# Final lightweight model: fine-tune the complete P2-P5 detector over the
# deployment range after the P2 head has been warm-started and stabilized.
#
# Stage 1 (`p2_fusion`) trained the new stride-4 path with the backbone frozen.
# This stage starts from its best checkpoint, unfreezes the full 2.58M-parameter
# model, and validates at 480 px rather than the legacy 640-px default.
name: p2_lightweight_final
data: /mnt/12TB_Drive/whisenaj/Datasets/M3FD_4ch/fusion.yaml
weights: /home/whisenaj/anaconda3/envs/Systems_Class/model/runs/p2_fusion_seed42/weights/best.pt
seed: 42
ms_sizes: [320, 400, 480]
train:
  imgsz: 480
  epochs: 75
  batch: 16
  optimizer: SGD
  lr0: 0.002
  warmup_epochs: 1.0
  close_mosaic: 10
  freeze: 0
  workers: 8
  cache: ram
  plots: true
